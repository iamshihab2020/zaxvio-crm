name: Keep API awake

# Render's free web services sleep after 15 minutes with no traffic, and a cold
# start takes about a minute. That is survivable for page loads, but it is not
# survivable for the API's in-process cron jobs (lib/cron/email-cron.ts): a
# sleeping process runs no timers, so overdue-invoice, renewal and trial-expiry
# emails would simply never be sent — silently, with no error anywhere.
#
# Pinging /health every 10 minutes keeps the process resident. That is roughly
# 730 instance-hours a month against Render's 750-hour free allowance, so it
# fits — but it fits with little room, which is why this pings one service and
# not several.
#
# The schedule that used to live here is deliberately gone. This repository is
# private, and private repos get 2,000 GitHub Actions minutes a month with a
# one-minute minimum billed per run. A ten-minute ping is ~4,320 runs a month,
# so it would burn the entire allowance — CI included — in about two weeks.
# Widening the interval does not rescue it either: the sleep timer is 15
# minutes, and even */14 is ~3,085 minutes.
#
# The ping therefore runs on an external uptime service (UptimeRobot,
# cron-job.org or similar), which is free at this frequency and costs no Actions
# minutes. Point it at:  https://zaxvio-api.onrender.com/health
#
# This workflow is kept as a manual button — useful for confirming the URL
# answers from outside your network without waiting on the external service.

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping /health
        env:
          # Repository secret. Just the origin, no trailing slash —
          # e.g. https://zaxvio-api.onrender.com
          API_URL: ${{ secrets.RENDER_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::RENDER_API_URL secret is not set — the API is not being kept awake."
            exit 1
          fi

          # --max-time 90 rather than the default: if the service *had* fallen
          # asleep, this request is the one paying the cold-start cost.
          # --retry covers a spin-up that overruns the first attempt.
          curl --fail --silent --show-error \
               --max-time 90 --retry 2 --retry-delay 15 \
               "$API_URL/health"
